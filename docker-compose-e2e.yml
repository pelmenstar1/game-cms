services:
  mongodb:
    image: mongo:latest
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - mongo_net

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      JWT_SECRET_KEY: uuIDEn4b+RdyPZAGgVBFeebpgqRRbMux0cuJRGgwfdcriLUQ97IJlGOkEM6QTD0qD00TN8jigrH4ElMRUsXsqPvPnV0qFJy6KY5v+y0v6+Opnr83amQUgaLicKaY5UayN63h5rsRnM88seD3KKmG0a1FlgdL13mrRcQMXOYljto=
      MONGO_CONNECTION_URL: mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - mongo_net

networks:
  mongo_net:
    driver: bridge
