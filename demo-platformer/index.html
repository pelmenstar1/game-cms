<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platformer Demo</title>
    <script type="module" src="./src/main.ts"></script>
    <link rel="stylesheet" href="./src/index.scss" />
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-screen-spinner">
        <div
          class="loading-screen-spinner-block"
          style="--row: 1; --column: 2"
        ></div>
        <div
          class="loading-screen-spinner-block"
          style="--row: 1; --column: 3"
        ></div>
        <div
          class="loading-screen-spinner-block"
          style="--row: 2; --column: 3"
        ></div>
        <div
          class="loading-screen-spinner-block"
          style="--row: 3; --column: 3"
        ></div>
        <div
          class="loading-screen-spinner-block"
          style="--row: 3; --column: 2"
        ></div>
        <div
          class="loading-screen-spinner-block"
          style="--row: 3; --column: 1"
        ></div>
        <div
          class="loading-screen-spinner-block"
          style="--row: 2; --column: 1"
        ></div>
        <div
          class="loading-screen-spinner-block"
          style="--row: 1; --column: 1"
        ></div>
      </div>
    </div>
    <div id="game-container"></div>
  </body>
</html>
