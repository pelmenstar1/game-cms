services:
  mongodb:
    image: mongo:latest
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  cms:
    build:
      context: ..
      dockerfile: demo-platformer/cms/Dockerfile
    ports:
      - '3001:3000'
    environment:
      JWT_SECRET_KEY: uuIDEn4b+RdyPZAGgVBFeebpgqRRbMux0cuJRGgwfdcriLUQ97IJlGOkEM6QTD0qD00TN8jigrH4ElMRUsXsqPvPnV0qFJy6KY5v+y0v6+Opnr83amQUgaLicKaY5UayN63h5rsRnM88seD3KKmG0a1FlgdL13mrRcQMXOYljto=
      MONGO_CONNECTION_URL: mongodb://mongodb:27017
      MONGO_USERNAME: admin
      MONGO_PASSWORD: password
    depends_on:
      - mongodb

  backend:
    build:
      context: ..
      dockerfile: demo-platformer/backend/Dockerfile
    ports:
      - '3000:3000'

volumes:
  mongo_data:
